name: Daily premium data update

on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install akshare pandas

      - name: Run scraper
        run: python build_data.py

      - name: Commit and push if no errors
        run: |
          python -c "
          import json, glob, sys
          files = glob.glob('data/*.json')
          if not files: print('无数据'); sys.exit(0)
          for f in files:
              if f.endswith('manifest.json'): continue
              d = json.load(open(f))
              if d.get('error'):
                  print(f'{f} 存在错误，跳过提交'); sys.exit(0)
          "
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: update $(date -u +%F)"
          git push
